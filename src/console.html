<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>她的后台控制台</title>
<style>
*{box-sizing:border-box}
:root{
 --fs-1:15px;--fs-2:14px;--fs-3:13.5px;--fs-4:12.5px;
 --ink:#1f2329;--ink-2:#4a5560;--ink-3:#7c8794;--brand:#07c160;--brand-d:#07994a;
 --line:#e6e9ec;--line-2:#eef1f4;--bg:#f4f6f8;--soft:#f8fafb;
}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;font-size:var(--fs-2);line-height:1.55;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
header{position:sticky;top:0;z-index:9;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:16px;letter-spacing:.2px}
header .mut{font-size:var(--fs-4);color:var(--ink-3)}
header .sp{flex:1}
header a{font-size:var(--fs-3);color:var(--brand);text-decoration:none;font-weight:500}
nav{position:sticky;top:57px;z-index:8;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:6px;padding:9px 18px}
nav button{font-family:inherit;font-size:var(--fs-3);padding:6px 14px;border-radius:999px;border:1px solid #dde2e7;background:#fff;cursor:pointer;color:var(--ink-2);transition:.15s}
nav button:hover{border-color:#c9d2d9;color:var(--ink)}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand);font-weight:500}
main{max-width:1360px;margin:0 auto;padding:14px 16px 96px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px;display:flex;flex-direction:column;gap:10px}
.card h3{margin:0;font-size:var(--fs-2);font-weight:600;color:var(--ink)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
/* 字段：左标签 + 右输入（标签固定宽度右对齐） */
.f{display:flex;align-items:center;gap:12px;flex:1 1 340px;min-width:300px}
.f>label{flex:0 0 120px;text-align:right;font-size:var(--fs-3);color:var(--ink-2);line-height:1.45}
.f>input,.f>select,.f>textarea{flex:1 1 auto;min-width:0}
.f.w-xs>input{max-width:96px}
.f.w-sm>input{max-width:150px}
.f.w-md>input,.f.w-md>select{max-width:100%}
.f.w-lg>input,.f.w-lg>textarea,.f.w-lg>select{max-width:100%}
input,select,textarea{font-family:inherit;font-size:var(--fs-2);padding:8px 11px;border:1px solid #dfe3e7;border-radius:8px;width:100%;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:hover,select:hover,textarea:hover{border-color:#cfd6dc}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(7,193,96,.13)}
textarea{resize:vertical;line-height:1.6;min-height:92px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand);margin:0;flex:none;cursor:pointer}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;padding:0;border:0;cursor:pointer}
input[type=range]:focus{box-shadow:none}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:#e5eaee}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;border-radius:50%;background:var(--brand);border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.22);margin-top:-6px}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:#e5eaee}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid #fff;border-radius:50%;background:var(--brand)}
button{font-family:inherit;font-size:var(--fs-3);padding:8px 15px;border-radius:8px;border:1px solid #dde2e7;background:#fff;cursor:pointer;color:var(--ink-2);transition:.15s;line-height:1}
button:hover{border-color:#c9d2d9;color:var(--ink);background:#fbfcfd}
button.pri{background:var(--brand);color:#fff;border-color:transparent;font-weight:500}
button.pri:hover{background:var(--brand-d);color:#fff}
button.dg{color:#c0392b}
button.dg:hover{background:#fdf3f2;border-color:#f0c9c4}
button:disabled{opacity:.45;cursor:default}
.ok{color:#0a9c46;font-size:var(--fs-4);font-weight:500}
.er{color:#c0392b;font-size:var(--fs-4);font-weight:500}
.mut{color:var(--ink-3);font-size:var(--fs-4);line-height:1.6}
.box{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:var(--soft)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dot{width:9px;height:9px;border-radius:99px;background:#c3c9cf;display:inline-block;flex:none}
.dot.on{background:#0a9c46}
.dot.pa{background:#e67e22}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{border:1px dashed #cdd5db;background:#fff;border-radius:999px;padding:4px 12px;font-size:var(--fs-4);cursor:pointer;color:var(--ink-2);font-family:inherit;transition:.15s}
.chip:hover{border-color:var(--brand);color:var(--brand-d)}
.chip.on{border-style:solid;color:var(--brand-d);border-color:var(--brand);background:#f2fbf6}
img.qr{width:240px;height:240px;border:1px solid var(--line);border-radius:12px}
#stopbtn{position:fixed;bottom:18px;right:18px;z-index:99;padding:11px 18px;border-radius:999px;font-size:var(--fs-3);box-shadow:0 4px 14px rgba(0,0,0,.12)}
#stopbtn.paused{background:#e67e22;color:#fff;border-color:transparent}
.chips::-webkit-scrollbar{width:8px}
.chips::-webkit-scrollbar-track{background:#f0f2f5;border-radius:4px}
.chips::-webkit-scrollbar-thumb{background:#c8ccd2;border-radius:4px}
/* ── 目录与两级折叠 ── */
.pageWrap{display:flex;gap:16px;align-items:flex-start}
.toc{position:sticky;top:112px;width:184px;flex:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;font-size:var(--fs-3)}
.toc>div:first-child{font-size:var(--fs-4);color:var(--ink-3);padding:4px 8px 6px}
.toc a{display:block;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.15s}
.toc a:hover{background:#f1f8f4;color:var(--brand-d)}
.pageBody{flex:1;min-width:0}
details.sec{background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
details.sec>summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;gap:10px;align-items:baseline;font-size:var(--fs-1);font-weight:600;color:var(--ink);user-select:none;background:var(--soft);transition:.15s}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary>span:first-child:before{content:'▸ ';color:#9aa0a8;font-weight:400}
details.sec[open]>summary>span:first-child:before{content:'▾ '}
details.sec>summary:hover{background:#f2f6f8}
details.sec>summary .mut{font-weight:400;font-size:var(--fs-4)}
.secBody{padding:12px 15px 15px;display:flex;flex-direction:column;gap:11px;border-top:1px solid var(--line-2)}
details.item{border:1px solid var(--line-2);border-radius:10px;background:#fff}
details.item>summary{list-style:none;cursor:pointer;padding:10px 12px;font-size:var(--fs-2);display:flex;gap:8px;align-items:baseline;user-select:none;transition:.15s}
details.item>summary::-webkit-details-marker{display:none}
details.item>summary>span:first-child:before{content:'+ ';color:var(--brand);font-weight:700}
details.item[open]>summary>span:first-child:before{content:'− '}
details.item>summary:hover{background:#f7fbf9}
details.item[open]>summary{border-bottom:1px solid var(--line-2);font-weight:600}
details.item>summary .mut{font-size:var(--fs-4)}
.itemBody{padding:12px;display:flex;flex-direction:column;gap:10px}
.secFoot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px dashed #e9edf0;margin-top:2px;padding-top:11px}
@media(max-width:900px){.toc{display:none}.pageWrap{display:block}.f>label{flex:0 0 96px}main{padding:12px 12px 90px}}

/* ── 自适应多列字段：填满宽度，消灭大片留白 ── */
.itemBody,.secBody,.card{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:11px 18px;align-items:center}
.itemBody>*:not(.f):not(.row),.secBody>*:not(.f):not(.row),.card>*:not(.f):not(.row){grid-column:1/-1}
.itemBody>.row,.secBody>.row,.card>.row{grid-column:1/-1}
.itemBody>.grid,.secBody>.grid,.card>.grid{grid-column:1/-1}
.f{min-width:0}
.f.w-lg{grid-column:1/-1}
/* ── 指标格 + 进度条 + 标签 ── */
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;align-items:stretch}
.metric{border:1px solid var(--line-2);border-radius:10px;padding:9px 11px;background:var(--soft);display:flex;flex-direction:column;gap:7px;justify-content:center}
.metric .k{font-size:var(--fs-4);color:var(--ink-3)}
.metric .v{font-size:16px;font-weight:600;color:var(--ink);line-height:1.25}
.metric .v small{font-size:var(--fs-4);font-weight:400;color:var(--ink-3)}
.bar{height:6px;border-radius:6px;background:#e8ecef;overflow:hidden;width:100%}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:6px;transition:width .3s}
.bar.warn>i{background:#e6a23c}
.bar.bad>i{background:#d9604b}
.tag{display:inline-block;font-size:var(--fs-4);padding:2px 9px;border-radius:999px;background:#eaf7f0;color:#0a9c46;font-weight:500}
.tag.warn{background:#fdf3e6;color:#b9770e}
.tag.bad{background:#fdeeec;color:#c0392b}
/* ── 表格（阶段阈值表等） ── */
table.tbl{width:100%;border-collapse:collapse;font-size:var(--fs-4)}
table.tbl th,table.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.tbl th{color:var(--ink-3);font-weight:500}
table.tbl tr.cur td{background:#f2fbf6;font-weight:600;color:var(--brand-d)}
</style>
</head>
<body>
<header>
<b>她的后台控制台</b><span class=mut id=hdname></span><span class=sp></span>
<span id=hdstop></span>
<a href=/wechat-companion/room target=_blank>她的房间</a>
</header>
<nav id=nav></nav>
<main id=main></main>
<button id=stopbtn onclick=toggleStop()>…</button>
<script>
var CFG=null,MODELS={},TIMER=null,CUR='';
function $(id){return document.getElementById(id)}
function esc(s){var d=document.createElement('div');d.textContent=s==null?'':String(s);return d.innerHTML}
function ckey(){try{return localStorage.getItem('ckey')||''}catch(e){return ''}}
function wurl(u){var k=ckey();return u+(k?((u.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(k)):'')}
function api(m,p,b){var k=ckey();return fetch('/wechat-companion/'+p+(k?((p.indexOf('?')<0?'?':'&')+'key='+encodeURIComponent(k)):''),{method:m,headers:b?{'content-type':'application/json'}:undefined,body:b?JSON.stringify(b):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok||j.error)throw new Error(j.error||('HTTP '+r.status));return j})})}
/* 远程访问口令：地址里带 ?key=xxx 打开一次就记住（随后从地址栏抹掉，免得截图/浏览历史带出去） */
try{var _km=/[?&]key=([^&]*)/.exec(location.search);if(_km){localStorage.setItem('ckey',decodeURIComponent(_km[1]));history.replaceState(null,'',location.pathname)}}catch(e){}
function card(t){var c=document.createElement('div');c.className='card';var h3=document.createElement('h3');h3.textContent=t;c.appendChild(h3);return c}
function row(){var r=document.createElement('div');r.className='row';for(var i=0;i<arguments.length;i++)r.appendChild(arguments[i]);return r}
function f(label,inp2,hint){var w=document.createElement('div');var t=(inp2&&inp2.tagName||'').toUpperCase();var tp=(inp2&&inp2.type)||'';var auto=(t==='TEXTAREA')?'lg':(/地址|路径|备注|描述|画像|背景|内容|搜索|监听|口令|口头禅|兴趣/.test(label)?'lg':((tp==='number'||tp==='range'||/年龄|次数|分钟|天数|上限|比例|概率/.test(label))?'xs':'md'));w.className='f w-'+(hint||auto);var lb=document.createElement('label');lb.textContent=label;w.appendChild(lb);w.appendChild(inp2);return w}
function inp(v,onch,ph,type){var i=document.createElement('input');if(type)i.type=type;i.value=(v==null?'':v);if(ph)i.placeholder=ph;i.onchange=function(e){onch(e.target.value)};return i}
function btn(t,cls,fn){var b=document.createElement('button');b.textContent=t;if(cls)b.className=cls;b.onclick=function(){fn(b)};return b}
/* 说明文字渲染：先转义，再把 **加粗** 与换行渲染出来。
   用它的原因：直接写 textContent 时，`**世界引擎**` 的星号会原样显示在界面上，
   而且换行会被压成一个空格、几行说明糊成一坨。 */
function escHtml(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function md(t){
 var NL=String.fromCharCode(10),ST=String.fromCharCode(42);
 var BS=String.fromCharCode(92),EST=BS+ST;
 var bold=new RegExp(EST+EST+'([^'+EST+']+)'+EST+EST,'g');
 return escHtml(t).replace(bold,'<b>$1</b>').split(NL).join('<br>');
}
function mut(t){var m=document.createElement('div');m.className='mut';m.innerHTML=md(t);return m}
function bx(){var d=document.createElement('div');d.className='box';return d}

function tocFor(list){var t=document.createElement('aside');t.className='toc';var h=document.createElement('div');h.className='mut';h.style.padding='4px 8px';h.textContent='本页目录';t.appendChild(h);list.forEach(function(x){var a=document.createElement('a');a.href='#'+x.id;a.textContent=x.icon+' '+x.title;a.onclick=function(e){e.preventDefault();var el=$(x.id);if(el){el.open=true;el.scrollIntoView({behavior:'smooth',block:'start'})}};t.appendChild(a)});return t}
function secBlock(id,icon,title,desc){var d=document.createElement('details');d.className='sec';d.id=id;d.open=true;var sm=document.createElement('summary');var t1=document.createElement('span');t1.textContent=icon+' '+title;sm.appendChild(t1);if(desc){var t2=document.createElement('span');t2.className='mut';t2.textContent=desc;sm.appendChild(t2)}d.appendChild(sm);var b=document.createElement('div');b.className='secBody';d.appendChild(b);return{el:d,body:b}}
function metric(k,v,extra){var d=document.createElement('div');d.className='metric';var a=document.createElement('div');a.className='k';a.textContent=k;d.appendChild(a);var b=document.createElement('div');b.className='v';b.innerHTML=v;d.appendChild(b);if(extra)d.appendChild(extra);return d}
function bar(pct,cls){var d=document.createElement('div');d.className='bar'+(cls?(' '+cls):'');var i=document.createElement('i');i.style.width=Math.max(0,Math.min(100,Number(pct)||0))+'%';d.appendChild(i);return d}
function tagEl(text,cls){var e=document.createElement('span');e.className='tag'+(cls?(' '+cls):'');e.textContent=text;return e}
function metricsWrap(){var d=document.createElement('div');d.className='metrics';return d}
function tbl(headers,rows){var t=document.createElement('table');t.className='tbl';var tr=document.createElement('tr');headers.forEach(function(h){var th=document.createElement('th');th.textContent=h;tr.appendChild(th)});t.appendChild(tr);rows.forEach(function(r){var x=document.createElement('tr');if(r.cur)x.className='cur';r.cells.forEach(function(c2,i2){var td=document.createElement('td');td.textContent=String(c2);x.appendChild(td)});t.appendChild(x)});return t}
function itemBlock(title,note){var d=document.createElement('details');d.className='item';var sm=document.createElement('summary');var t1=document.createElement('span');t1.textContent=title;sm.appendChild(t1);if(note){var t2=document.createElement('span');t2.className='mut';t2.textContent=note;sm.appendChild(t2)}d.appendChild(sm);var b=document.createElement('div');b.className='itemBody';d.appendChild(b);return{el:d,body:b}}
/* 生日 → 星座/年龄（与 src/birthday.js 同一套规则；输入时实时显示，不等保存） */
function bdayInfo(raw){
 var s=String(raw==null?'':raw).trim().replace(/[年月]/g,'-').replace(/日/g,'').replace(/[./]/g,'-').replace(/\s+/g,'');
 var Z=[[1,20,'水瓶座'],[2,19,'双鱼座'],[3,21,'白羊座'],[4,20,'金牛座'],[5,21,'双子座'],[6,22,'巨蟹座'],[7,23,'狮子座'],[8,23,'处女座'],[9,23,'天秤座'],[10,24,'天蝎座'],[11,22,'射手座'],[12,22,'摩羯座']];
 if(!s) return {valid:false,age:null,zodiac:'',hasYear:false,iso:'',hint:'先填生日（例如 1999-03-14）'};
 var m=s.match(/^(\d{4})[-\/]?(\d{1,2})[-\/]?(\d{1,2})$/), hasYear=true;
 if(!m){m=s.match(/^(\d{1,2})[-\/]?(\d{1,2})$/);hasYear=false}
 if(!m) return {valid:false,age:null,zodiac:'',hasYear:false,iso:'',hint:'看不懂这个写法，请用 1999-03-14（或只填 03-14，但那样算不出年龄）'};
 var y=hasYear?Number(m[1]):null, mo=Number(m[m.length-2]), d=Number(m[m.length-1]);
 if(!(mo>=1&&mo<=12)||!(d>=1&&d<=31)) return {valid:false,age:null,zodiac:'',hasYear:false,iso:'',hint:'月或日超出范围了'};
 var z='';Z.forEach(function(x){if(mo===x[0]&&d>=x[1])z=x[2]});
 if(!z) z=(mo===1?'摩羯座':Z[((mo-2)+12)%12][2]);
 var age=null;
 if(hasYear){var dd=new Date(),m2=dd.getMonth()+1,d2=dd.getDate();age=dd.getFullYear()-y;var bmo=(mo===2&&d===29)?3:mo,bd=(mo===2&&d===29)?1:d;if(m2<bmo||(m2===bmo&&d2<bd))age-=1}
 var iso=(hasYear?String(y).padStart(4,'0')+'-':'')+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
 return {valid:true,hasYear:hasYear,iso:iso,zodiac:z,age:age,hint:hasYear?'':'没填年份 → 只算得出星座，年龄要你自己填'};
}
function loadCfg(){return api('GET','panel/config').then(function(r){CFG=r.config||{};return CFG})}
function drawStop(){var b=$('stopbtn');var p=!!(CFG&&CFG.paused);b.textContent=p?'已急停·点击解除':'急停';b.className=p?'paused':''}
function toggleStop(){loadCfg().then(function(c){api('POST','panel/config',{paused:!c.paused}).then(function(r){CFG=r.config||CFG;drawStop()}).catch(function(){})}).catch(function(){})}
function drawName(){api('GET','panel/persona').then(function(r){$('hdname').textContent='· '+((r.persona&&r.persona.name)||'她')}).catch(function(){})}

/* ── 首页 = 连接+实况+试聊 ── */
/* ── 首页（状态常显 · 分区可折叠） ── */
function tHome(box){
 box.innerHTML='';
 var SECS=[
  {id:'hm-conn',icon:'🔌',title:'连接与运行',desc:'启停 · 扫码绑定 · 连接自检'},
  {id:'hm-today',icon:'☀️',title:'今天的她',desc:'每日随机 · 人设自动定基调'},
  {id:'hm-live',icon:'📡',title:'实况直播',desc:'4 秒刷新'},
  {id:'hm-test',icon:'💬',title:'试聊',desc:'真实模型，不真的发出去'}
 ];
 var wrap=document.createElement('div');wrap.className='pageWrap';box.appendChild(wrap);
 wrap.appendChild(tocFor(SECS));
 var body=document.createElement('div');body.className='pageBody';wrap.appendChild(body);
 body.appendChild(mut('这一页是"她现在怎么样"：连接通不通、今天是什么状态、正在发生什么。状态类内容默认展开，方便一眼看到。'));
 var OBJ={},S={};
 SECS.forEach(function(x){var sb=secBlock(x.id,x.icon,x.title,x.desc);OBJ[x.id]=sb.el;S[x.id]=sb.body;body.appendChild(sb.el)});
 OBJ['hm-test'].open=false;
 tStatus(S['hm-conn']);
 tToday(S['hm-today']);
 tLiveFeed(S['hm-live']);
 tTest(S['hm-test']);
}

/* ── 你们 = 相处记录 + 称呼 + 名单（分区折叠） ── */
function tRelation(box){
 box.innerHTML='';
 var SECS=[
  {id:'rel-stage',icon:'🎞️',title:'相处记录',desc:'认识多久 · 聊过多少 · 最后联系'},
  {id:'rel-call',icon:'🏷️',title:'称呼与关系',desc:'她怎么叫你 · 你叫她什么'},
  {id:'rel-list',icon:'👥',title:'名单与范围',desc:'主人 · 黑名单 · 回复范围'},
  {id:'rel-promise',icon:'🤝',title:'她答应过的事',desc:'到期她自己提 · 可取消改期'}
 ];
 var wrap=document.createElement('div');wrap.className='pageWrap';box.appendChild(wrap);
 wrap.appendChild(tocFor(SECS));

 });
 box.appendChild(st);

  }).catch(function(e){st.className='er';st.textContent='保存失败：'+e.message}).then(function(){b2.disabled=false});
 }), mut(meta.hint||'')));
 api('GET','panel/config').then(function(r){

 }).catch(function(){});
 return box;
}

 /* ④ 实时草稿 */
 var g4=itemBlock('女娲当前捏的草稿','');g4.el.open=true;S['nw-draft'].appendChild(g4.el);
 var dc=document.createElement('div');dc.style.gridColumn='1/-1';g4.body.appendChild(dc);

 function bubble(who,t){var b=bx();b.innerHTML='<b>'+esc(who)+'</b>　'+esc(t);MSG.appendChild(b);MSG.scrollTop=MSG.scrollHeight}
 function drawDraft(){dc.innerHTML='';
  if(!DRAFT||!Object.keys(DRAFT).length){dc.appendChild(mut('女娲还没开始捏——先在上方跟她聊几句，这里会实时长出人设草稿。'));return}
  dc.appendChild(mut('名字: '+(DRAFT.name||'—')+' · 生日: '+(DRAFT.birthday||'—')+' · 城市: '+(DRAFT.city||'—')+' · 职业: '+(DRAFT.job||'—')+' · 年龄: '+(DRAFT.age||'—')));
  if(DRAFT.personaText)dc.appendChild(mut('背景: '+String(DRAFT.personaText).slice(0,200)));
  var A=DRAFT.assessments||{};
  var al='测评: '+(A.mbti||'')+(A.functions?('（'+A.functions+'）'):'');
  if(al!=='测评: ')dc.appendChild(mut(al));
  var APT=DRAFT.appearanceText||'';
  if(APT)dc.appendChild(mut('外貌: '+String(APT).slice(0,200)));
  dc.appendChild(mut('兴趣: '+((DRAFT.interests||[]).join('、')||'—')+' · 口头禅: '+(((DRAFT.quirks||{}).catchphrases||[]).join('、')||'—')+' · 红线: '+((DRAFT.redLines||[]).join('、')||'—')));
  var IN=DRAFT.inner||{};
  if(Object.keys(IN).length)dc.appendChild(mut('内心: '+[['desire',IN.desire],['fear',IN.fear],['values',IN.values],['quirk',IN.quirk]].filter(function(x){return x[1]}).map(function(x){return x[0]+':'+x[1]}).join(' · ')));
  dc.appendChild(mut('记忆种子 '+(DRAFT.memorySeeds||[]).length+' 条 · 风格样例 '+(DRAFT.styleExamples||[]).length+' 条'));
  var B=DRAFT.behavior||{};var BB=B.behavior||{};var BL=B.life||{};
  if(BB.speedMul!=null||BL.pokesPerDay!=null)dc.appendChild(mut('行为建议: 手速 ×'+(BB.speedMul==null?1:BB.speedMul)+' · 拆条上限 '+(BB.chunkMax||'—')+' · 每日主动 '+(BL.pokesPerDay==null?'—':BL.pokesPerDay)+' 次'+(BL.wake?(' · 作息 '+BL.wake+'~'+(BL.sleep||'')):'')));
  var acts=row(btn('① 应用到人设（含测评/外貌/内心）+ 导入记忆','pri',function(){api('POST','panel/workshop/apply',{draft:DRAFT}).then(function(r2){st.className='ok';st.textContent='已应用 ✅（'+r2.seeds+' 条记忆种子进 mem0；应用前已自动快照，可回滚）'}).catch(function(e){st.className='er';st.textContent='失败: '+e.message})}));
  if(BB.speedMul!=null||BL.pokesPerDay!=null)acts.appendChild(btn('② 行为建议写进人设','',function(){api('POST','panel/persona',{behavior:{speedMul:BB.speedMul,baseWake:BL.wake,baseSleep:BL.sleep,activePerDay:BL.pokesPerDay}}).then(function(){st.className='ok';st.textContent='行为建议已写进人设 ✅'}).catch(function(e){st.className='er';st.textContent='失败: '+e.message})}));
  dc.appendChild(acts);
  dc.appendChild(mut('随时继续和女娲聊着改；应用后可以在「她→存档」里切回旧版本。'));
 }
 function send(){var t=tin.value.trim();if(!t&&!pendingImgs.length)return;tin.value='';bubble('你',t+(pendingImgs.length?('（'+pendingImgs.length+' 张图）'):''));st.className='mut';st.textContent='女娲捏人中…（约10-30秒）';sendB.disabled=true;
  api('POST','panel/workshop/chat',{sessionId:SID,message:t,images:pendingImgs}).then(function(r){pendingImgs=[];imgPrev.textContent='';imgIn.value='';SID=r.sessionId;localStorage.setItem('ws-sid',SID);DRAFT=r.draft||DRAFT;bubble('女娲',r.reply||'…');drawDraft();st.textContent='';loadSessions()}).catch(function(e){st.className='er';st.textContent=e.message}).then(function(){sendB.disabled=false})}
 function loadSessions(auto){api('GET','panel/workshop/sessions').then(function(r){
  var list=r.sessions||[];sess.innerHTML='';
  list.forEach(function(s2){var op=document.createElement('option');op.value=s2.id;op.textContent=(s2.title||'新造人')+' · '+new Date(s2.updatedAt).toLocaleString('zh-CN');if(s2.id===SID)op.selected=true;sess.appendChild(op)});
  sess.onchange=function(){loadSession(sess.value)};
  if(!auto)return;
  if(SID&&list.some(function(s2){return s2.id===SID})){loadSession(SID)}
  else if(list.length){loadSession(list[0].id)}
  else{api('POST','panel/workshop/sessions/new',{}).then(function(r2){SID=r2.session.id;localStorage.setItem('ws-sid',SID);loadSession(SID);loadSessions(false)}).catch(function(e){st.textContent=e.message})}
 }).catch(function(e){st.textContent=e.message})}
 function loadSession(id){SID=id;localStorage.setItem('ws-sid',id);api('GET','panel/workshop/session?id='+encodeURIComponent(id)).then(function(r){MSG.innerHTML='';var ss=r.session||{};(ss.messages||[]).forEach(function(m2){bubble(m2.role==='user'?'你':'女娲',m2.text)});DRAFT=ss.draft||null;drawDraft()}).catch(function(e){st.textContent=e.message})}
 loadSessions(true);
}
function h3t(t){var d=document.createElement('div');d.style.fontWeight='600';d.textContent=t;return d}
/* ── 试聊（写进给定容器；不真的发到微信） ── */
function tTest(box){
 var c=card('回复预览（真实模型，不发送）');box.appendChild(c);
 var t=document.createElement('input');t.value='在干嘛呢';c.appendChild(f('对她说',t));
 var rec=document.createElement('input');rec.type='checkbox';rec.checked=true;
 var out2=document.createElement('div');out2.style.gridColumn='1/-1';
 var goBtn=btn('让她回','pri',function(b2){b2.disabled=true;b2.textContent='她想…';out2.innerHTML='';
  api('POST','panel/soul-test',{text:t.value,record:rec.checked,peerKey:'room'}).then(function(r){
   (r.chunks||[]).forEach(function(ch){var b=bx();b.innerHTML='<b>她：</b>'+esc(ch);out2.appendChild(b)});
   var bb=bx();bb.className='mut';bb.textContent='大脑: '+(r.backend||'')+' · 心情 '+Math.round(r.mood||0)+' · '+((r.delaysMs||[]).join('/'))+'ms';out2.appendChild(bb);
  }).catch(function(e){out2.appendChild(mut('失败: '+e.message))}).then(function(){b2.disabled=false;b2.textContent='让她回'})});
 c.appendChild(row(rec,document.createTextNode('计入记忆'),goBtn));
 c.appendChild(out2);
 c.appendChild(mut('勾选"计入记忆"时，这场试聊会进她的记忆（归属 room），跟真聊天一样影响她的心情。'));
}

/* ── 功能状态（她会什么/还不会什么，诚实清单） ── */
function tFeatures(box){
 api('GET','panel/features').then(function(r){
  var top=card('功能状态一览 · 这份清单她本人也「看得到」——聊天里被问到时她会照实自然回答');box.appendChild(top);
  var eng=mut('加载引擎状态…');top.appendChild(eng);
  Promise.all([api('GET','panel/mem-engine'),api('GET','panel/wxauto/status')]).then(function(rs){
   eng.textContent='记忆引擎: '+(rs[0].running?((rs[0].info&&rs[0].info.ready===false)?'⚠️ 缺配置（保存模型后自动恢复）':'✅ mem0'):'⚠️ 未运行（本地兜底）')+' · 通道: '+(((rs[1].mode==='wxauto')&&rs[1].enabled)?'wxauto（PC接管）':'ClawBot（官方机器人）')+' · wxauto桥: '+(rs[1].bridge&&rs[1].bridge.ready?'✅':'未启动（默认关，正常）');
  }).catch(function(){});
  var BADGE={done:'✅ 可用',partial:'🟡 部分可用',building:'🔨 本批在建',planned:'📌 已规划',shelved:'⏸️ 搁置'};
  var CLS={done:'ok',partial:'er',building:'ok',planned:'mut',shelved:'mut'};
  (r.groups||[]).forEach(function(g){
   var c=card(g.name);box.appendChild(c);
   (g.items||[]).forEach(function(f2){
    var b=bx();
    var nm=document.createElement('div');nm.innerHTML='<b>'+esc(f2.name)+'</b> <span class="'+(CLS[f2.status]||'mut')+'">'+(BADGE[f2.status]||f2.status)+'</span>';
    b.appendChild(nm);
    b.appendChild(mut(f2.detail||''));
    if(f2.blocked)b.appendChild(mut('卡点: '+f2.blocked));
    if(f2.plan)b.appendChild(mut('计划: '+f2.plan));
    c.appendChild(b);
   });
  });
 }).catch(function(e){box.innerHTML='';box.appendChild(mut('加载失败: '+e.message))});
}

var TABS=[{id:'home',name:'首页',fn:tHome},{id:'persona',name:'她',fn:tPersona},{id:'world',name:'🌍 世界',fn:tWorld},{id:'relation',name:'你们',fn:tRelation},{id:'memory',name:'记忆',fn:tMemory},{id:'brain',name:'大脑',fn:tBrain},{id:'nwa',name:'女娲',fn:tWorkshop},{id:'ops',name:'机务',fn:tOps}];
function go(id){CUR=id;localStorage.setItem('ctab',id);if(TIMER){clearInterval(TIMER);TIMER=null}
 var main=$('main');main.innerHTML='';var hit=false;TABS.forEach(function(t){if(t.id===id){t.fn(main);hit=true}});if(!hit){CUR=TABS[0].id;localStorage.setItem('ctab',CUR);TABS[0].fn(main)}
 var n=$('nav');n.innerHTML='';TABS.forEach(function(t){var b=document.createElement('button');b.textContent=t.name;if(t.id===CUR)b.className='on';b.onclick=function(){go(t.id)};n.appendChild(b)})}
init=function(){drawStop();drawName();go(localStorage.getItem('ctab')||'home')};
init();
